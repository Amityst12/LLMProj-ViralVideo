# Netlify Deployment Configuration (Module 7: Delivery & Serverless Deployment)

[build]
  publish = "src/client"
  functions = "netlify/functions"
  command = "npm run build"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
